<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gopi S. — Security Engineer Portfolio</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<canvas id="matrix"></canvas>

<header class="nav">
  <div class="brand" id="brand"></div>
  <nav class="links"><a href="#about">About</a><a href="#skills">Skills</a><a href="#experience">Experience</a><a href="#contact">Contact</a></nav>
</header>

<main class="container">
  <section id="hero" class="hero">
    <div class="hero-left">
      <h1>Hi, I’m <span class="neon" id="fn"></span></h1>
      <h2 id="title"></h2>
      <p class="lead" id="lead"></p>
      <div class="cta"><a class="btn btn-primary" href="#contact">Get in touch</a><a class="btn btn-ghost" href="#experience">View experience</a></div>
      <div class="badges" id="badges"></div>
    </div>
    <div class="hero-right"><div class="profile-ring"><div class="profile-pic" id="ini"></div></div></div>
  </section>

  <section id="about" class="card">
    <h3>Professional Summary</h3>
    <p id="sum"></p>
    <div class="meta" id="meta"></div>
  </section>

  <section id="skills" class="card">
    <h3>Core Competencies</h3><div class="comp" id="comp"></div>
    <h3 style="margin-top:32px">Security Technology Experience</h3><div class="tech" id="tech"></div>
  </section>

  <section id="experience" class="card"><h3>Professional Experience</h3><div id="exp"></div></section>

  <section id="certs" class="card"><h3>Certifications</h3><ul class="certs" id="certList"></ul></section>

  <section id="education" class="card">
    <h3>Education</h3><div id="edu"></div>
    <h3 style="margin-top:28px">Professional Strengths</h3><div class="badges" id="str" style="margin-top:0"></div>
  </section>

  <section id="contact" class="card">
    <h3>Contact</h3>
    <p id="cnote"></p>
    <div class="contact-grid" id="cgrid"></div>
  </section>

  <footer class="footer"><small id="foot"></small></footer>
</main>

<script src="script.js"></script>
</body>
</html>
